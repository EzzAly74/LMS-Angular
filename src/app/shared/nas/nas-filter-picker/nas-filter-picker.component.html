<p-dialog #fpDlg
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  (onHide)="restoreFocus()"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  [resizable]="false"
  [dismissableMask]="true"
  [closeOnEscape]="true"
  [focusOnShow]="true"
  styleClass="nas-fp"
  [style]="{ width: '512px', maxWidth: 'calc(100vw - 32px)' }">
  <ng-template pTemplate="headless">
    <div class="nas-fp__card" role="document">
      <header class="nas-fp__head">
        <!-- PrimeNG labels its dialog element by this id; the host attribute named nothing. -->
        <h2 class="nas-fp__title" [id]="fpDlg.ariaLabelledBy">{{ title() ?? ('filter_picker.title' | translate) }}</h2>
        <button type="button" class="nas-fp__close" (click)="close()" [attr.aria-label]="'common.close' | translate">
          <img src="assets/icons/figma/close-x.svg" width="16" height="16" alt="" />
        </button>
      </header>

      <div class="nas-fp__body">
        @if (searchable()) {
        <label class="nas-fp__label" [for]="uid + '-search'">{{ label() }}</label>
        <div class="nas-fp__search">
          <nas-icon name="magnifying-glass" [size]="20" />
          <input
            type="search"
            class="nas-fp__search-input"
            [id]="uid + '-search'"
            [placeholder]="'common.quick_search' | translate"
            [value]="search()"
            (input)="onSearch(searchInput.value)"
            #searchInput />
        </div>
        }

        <div class="nas-fp__list" [class.nas-fp__list--fit]="!searchable()" role="group" [attr.aria-labelledby]="fpDlg.ariaLabelledBy" [attr.aria-busy]="loading()">
          @if (loading()) {
            <p class="nas-fp__note">{{ 'common.loading' | translate }}</p>
          } @else {
            @for (o of filtered(); track o.id) {
              <label class="nas-fp__option">
                <input type="checkbox" class="nas-fp__native" [checked]="isChecked(o.id)" (change)="toggle(o.id)" />
                <span class="nas-fp__box" aria-hidden="true">
                  @if (isChecked(o.id)) {
                    <img src="assets/icons/figma/checkbox-check.svg" width="12" height="12" alt="" />
                  }
                </span>
                <span class="nas-fp__option-text" dir="auto">{{ o.label }}</span>
              </label>
            } @empty {
              <p class="nas-fp__note">{{ 'filter_picker.no_options' | translate }}</p>
            }
          }
        </div>
      </div>

      <footer class="nas-fp__foot">
        @if (mode() === 'view') {
          <button type="button" class="nas-fp__btn nas-fp__btn--ghost" (click)="close()">
            {{ 'common.cancel' | translate }}
          </button>
          <button type="button" class="nas-fp__btn nas-fp__btn--primary" (click)="submit()" [disabled]="working().size === 0">
            <nas-icon name="eye" [size]="20" />
            <span>{{ 'filter_picker.view_results' | translate }}</span>
          </button>
        } @else {
          <button type="button" class="nas-fp__btn nas-fp__btn--ghost" (click)="clear()">
            {{ 'filter_picker.clear' | translate }}
          </button>
          <button type="button" class="nas-fp__btn nas-fp__btn--primary" (click)="submit()">
            <nas-icon name="funnel" [size]="20" />
            <span>{{ 'filter_picker.filter' | translate }}</span>
          </button>
        }
      </footer>
    </div>
  </ng-template>
</p-dialog>
