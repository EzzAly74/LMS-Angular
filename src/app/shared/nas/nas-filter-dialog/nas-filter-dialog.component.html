<p-dialog #fdDlg
  [visible]="visible()"
  (visibleChange)="onVisibleChange($event)"
  (onHide)="restoreFocus()"
  [modal]="true"
  [closable]="true"
  [draggable]="false"
  [resizable]="false"
  [dismissableMask]="true"
  styleClass="fd"
  [style]="{ width: '512px', maxWidth: 'calc(100vw - 32px)' }">
  <ng-template pTemplate="headless">
    <form class="fd__card" (ngSubmit)="submit()" novalidate>
      <header class="fd__head">
        <h2 class="fd__title" [id]="fdDlg.ariaLabelledBy">{{ 'common.filter' | translate }}</h2>
        <button type="button" class="fd__close" (click)="visible.set(false)" [attr.aria-label]="'common.close' | translate">
          <img src="assets/icons/figma/close-x.svg" width="16" height="16" alt="" />
        </button>
      </header>

      <div class="fd__body">
        @for (f of fields(); track f.key) {
          <div class="fd__field" [class.fd__field--wide]="f.wide">
            @if (f.type === 'date') {
            <label class="fd__label" [id]="uid + '-' + f.key" [for]="uid + '-in-' + f.key">{{ f.label }}</label>
            <nas-datepicker
              [inputId]="uid + '-in-' + f.key"
              [ngModel]="dateValue(f.key)"
              (ngModelChange)="setDate(f.key, $event)"
              [ngModelOptions]="{ standalone: true }"
              [min]="dateValue(f.after)"
              [max]="dateValue(f.before)"
              [placeholder]="f.placeholder" />
            } @else {
            <span class="fd__label" [id]="uid + '-' + f.key">{{ f.label }}</span>
            @if (f.multiple) {
            <p-multiSelect #ms
              (onPanelShow)="overlayOpen.set(true)"
              (onPanelHide)="overlayOpen.set(false); f.remote && onRemoteFilter(f.key, '')"
              (onFilter)="f.remote && onRemoteFilter(f.key, $event.filter)"
              [ariaLabelledBy]="uid + '-' + f.key"
              [options]="f.options"
              optionLabel="label"
              optionValue="id"
              [ngModel]="value(f.key)"
              (ngModelChange)="set(f.key, $event)"
              [ngModelOptions]="{ standalone: true }"
              [filter]="true"
              filterBy="label"
              [showToggleAll]="false"
              [resetFilterOnHide]="true"
              [filterPlaceHolder]="f.searchPlaceholder ?? ('common.search' | translate)"
              [ariaFilterLabel]="f.searchPlaceholder ?? ('common.search' | translate)"
              [maxSelectedLabels]="1"
              [selectedItemsLabel]="'common.n_selected' | translate"
              [placeholder]="f.placeholder"
              [emptyMessage]="(f.remote ? 'common.type_to_search' : 'common.no_options') | translate"
              [emptyFilterMessage]="'common.no_results' | translate"
              appendTo="body"
              panelStyleClass="fd-ms-panel"
              styleClass="fd__dropdown">
              <!-- Figma 2430:134497: a clear-search button in the search row and
                   "N selected · Clear all" under it (ordered by the panel CSS). -->
              <ng-template pTemplate="header">
                @if (ms._filterValue()) {
                  <button type="button" class="fd-ms-clear-search" (click)="ms.resetFilter(); f.remote && onRemoteFilter(f.key, '')"
                    [attr.aria-label]="'common.clear_search' | translate">
                    <img src="assets/icons/figma/x-circle-fill-14.svg" width="18" height="18" alt="" />
                  </button>
                }
                <div class="fd-ms-summary">
                  <span aria-live="polite">{{ 'common.count_selected' | translate: { count: count(f.key) } }}</span>
                  <button type="button" class="fd-ms-clear-all" [disabled]="!count(f.key)" (click)="set(f.key, null)">{{ 'common.clear_all' | translate }}</button>
                </div>
              </ng-template>
            </p-multiSelect>
            } @else {
            <p-dropdown
              (onShow)="overlayOpen.set(true)"
              (onHide)="overlayOpen.set(false)"
              (onFilter)="f.remote && onRemoteFilter(f.key, $event.filter)"
              [resetFilterOnHide]="true"
              [ariaLabelledBy]="uid + '-' + f.key"
              [options]="f.options"
              optionLabel="label"
              optionValue="id"
              [ngModel]="value(f.key)"
              (ngModelChange)="set(f.key, $event)"
              [ngModelOptions]="{ standalone: true }"
              [showClear]="true"
              [filter]="f.remote || f.options.length > 8"
              filterBy="label"
              [placeholder]="f.placeholder"
              [emptyMessage]="(f.remote ? 'common.type_to_search' : 'common.no_options') | translate"
              [emptyFilterMessage]="'common.no_results' | translate"
              appendTo="body"
              styleClass="fd__dropdown"
              panelStyleClass="fd-dd-panel" />
            }
            }
          </div>
        }
      </div>

      <footer class="fd__foot">
        <button type="button" class="fd__btn fd__btn--outline" (click)="clear()">{{ 'common.clear' | translate }}</button>
        <button type="submit" class="fd__btn fd__btn--primary" [disabled]="!changed()">
          <nas-icon name="funnel" [size]="20" />
          {{ 'common.filter' | translate }}
        </button>
      </footer>
    </form>
  </ng-template>
</p-dialog>
